/* ============================================================================
   PerformU Backend API Client
   ----------------------------------------------------------------------------
   Sisipkan blok ini ke file PerformU HTML tepat SEBELUM baris:
     const NKO_STORAGE_KEY = "performu_nko_structure_v1";
   (sekitar baris 162 di PerformU_9_Login_2.html)

   Strategi: "local-first + background sync".
   - Semua load*()/save*() TETAP baca/tulis localStorage dulu (instan, tidak
     mengubah perilaku UI yang sudah ada / tidak berisiko race condition).
   - Setiap save juga mengirim salinan ke backend secara async (fire-and-forget
     dengan retry sederhana). Saat aplikasi dibuka, kita tarik data terbaru
     dari backend (kalau ada & lebih baru) sebelum render pertama.
   - Auth diganti total: checkAuthCredentials() sekarang memanggil backend
     sungguhan (bukan AUTH_ACCOUNTS hardcoded), dan token JWT disimpan
     bersama session.
   ========================================================================= */

const PERFORMU_API_BASE = window.PERFORMU_API_BASE || "https://performu-backend-production.up.railway.app";

function performuGetToken() {
  try {
    const raw = window.localStorage.getItem(AUTH_STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed && parsed.token ? parsed.token : null;
  } catch (e) {
    return null;
  }
}

async function performuApiFetch(path, options = {}) {
  const token = performuGetToken();
  const headers = Object.assign(
    { "Content-Type": "application/json" },
    token ? { Authorization: `Bearer ${token}` } : {},
    options.headers || {}
  );
  const res = await fetch(`${PERFORMU_API_BASE}${path}`, { ...options, headers });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `Request gagal (${res.status})`);
  }
  const contentType = res.headers.get("content-type") || "";
  return contentType.includes("application/json") ? res.json() : res;
}

/* ---- Auth: replaces checkAuthCredentials / loadAuthSession / saveAuthSession / clearAuthSession ---- */

async function performuLogin(userId, password) {
  const data = await performuApiFetch("/auth/login", {
    method: "POST",
    body: JSON.stringify({ userId, password })
  });
  // data = { token, user: { userId, role, displayName } }
  const session = { ...data.user, token: data.token };
  performuSaveAuthSession(session);
  return session;
}

function performuSaveAuthSession(session) {
  try {
    window.localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
  } catch (e) {}
}

function performuLoadAuthSession() {
  try {
    const raw = window.localStorage.getItem(AUTH_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.role && parsed.userId && parsed.token) return parsed;
    }
  } catch (e) {}
  return null;
}

function performuClearAuthSession() {
  try {
    window.localStorage.removeItem(AUTH_STORAGE_KEY);
  } catch (e) {}
}

/* ---- Generic debounced background sync helper ---- */

const performuSyncTimers = {};
function performuSyncDebounced(key, fn, delay = 800) {
  if (performuSyncTimers[key]) clearTimeout(performuSyncTimers[key]);
  performuSyncTimers[key] = setTimeout(() => {
    fn().catch(err => console.warn(`[PerformU sync] ${key} gagal, data tetap aman di localStorage:`, err.message));
  }, delay);
}

/* ---- NKO structure sync ---- */

async function performuPullNkoStructure() {
  try {
    const remote = await performuApiFetch("/nko");
    if (remote && remote.years && remote.years.length) return remote;
  } catch (e) {
    console.warn("[PerformU sync] gagal ambil struktur NKO dari server, pakai data lokal:", e.message);
  }
  return null;
}

function performuPushNkoYear(year, structure) {
  performuSyncDebounced(`nko-${year}`, () =>
    performuApiFetch(`/nko/${year}`, { method: "PUT", body: JSON.stringify(structure) })
  );
}

// Deleting a year is a discrete, confirmed action (not free-form typing),
// so it fires immediately instead of going through the 800ms debounce —
// otherwise a quick refresh right after confirming the delete can race the
// pending PUT/DELETE and the year reappears on reload. Also cancels any
// still-pending debounced PUT for that year so a stale save can't recreate
// the row right after the delete lands.
function performuDeleteNkoYear(year) {
  const key = `nko-${year}`;
  if (performuSyncTimers[key]) { clearTimeout(performuSyncTimers[key]); delete performuSyncTimers[key]; }
  return performuApiFetch(`/nko/${year}`, { method: "DELETE" }).catch(err => {
    console.warn(`[PerformU sync] gagal menghapus tahun NKO ${year} di server, tetap terhapus lokal:`, err.message);
  });
}

/* ---- Data Kinerja sync ---- */

function performuPushDataKinerja(categoryId, year, subTab, payload) {
  performuSyncDebounced(`dk-${categoryId}-${year}-${subTab || ""}`, () =>
    performuApiFetch("/data-kinerja", {
      method: "PUT",
      body: JSON.stringify({ categoryId, year, subTab: subTab || null, payload })
    })
  );
}

// Same as performuPushDataKinerja but skips the 800ms debounce — for
// discrete, confirmed actions (e.g. deleting a year) where a quick refresh
// right after the action could otherwise race the pending save and the
// deleted data would reappear on reload.
function performuPushDataKinerjaNow(categoryId, year, subTab, payload) {
  const key = `dk-${categoryId}-${year}-${subTab || ""}`;
  if (performuSyncTimers[key]) { clearTimeout(performuSyncTimers[key]); delete performuSyncTimers[key]; }
  return performuApiFetch("/data-kinerja", {
    method: "PUT",
    body: JSON.stringify({ categoryId, year, subTab: subTab || null, payload })
  }).catch(err => {
    console.warn(`[PerformU sync] ${key} gagal (immediate), data tetap aman di localStorage:`, err.message);
  });
}

async function performuPullAllDataKinerja() {
  try {
    return await performuApiFetch("/data-kinerja");
  } catch (e) {
    console.warn("[PerformU sync] gagal ambil Data Kinerja dari server, pakai data lokal:", e.message);
    return [];
  }
}

/* ---- Settings (UI config / custom tabs / notes / AI settings) sync ---- */

function performuPushUiConfig(config) {
  performuSyncDebounced("ui-config", () => performuApiFetch("/settings/ui-config", { method: "PUT", body: JSON.stringify(config) }));
}
function performuPushCustomTab(tabId, definition) {
  performuSyncDebounced(`custom-tab-${tabId}`, () => performuApiFetch("/settings/custom-tabs", { method: "PUT", body: JSON.stringify({ tabId, definition }) }));
}
function performuPushNote(type, scopeKey, content) {
  performuSyncDebounced(`note-${type}-${scopeKey}`, () => performuApiFetch(`/settings/notes/${type}`, { method: "PUT", body: JSON.stringify({ scopeKey, content }) }));
}
function performuPushAiSettings(settings) {
  performuSyncDebounced("ai-settings", () => performuApiFetch("/settings/ai-settings", { method: "PUT", body: JSON.stringify(settings) }));
}

async function performuPullSettingsBundle() {
  const [uiConfig, customTabs, analisaNotes, rootCauseNotes, aiSettings] = await Promise.allSettled([
    performuApiFetch("/settings/ui-config"),
    performuApiFetch("/settings/custom-tabs"),
    performuApiFetch("/settings/notes/analisa"),
    performuApiFetch("/settings/notes/root_cause"),
    performuApiFetch("/settings/ai-settings")
  ]);
  return {
    uiConfig: uiConfig.status === "fulfilled" ? uiConfig.value : null,
    customTabs: customTabs.status === "fulfilled" ? customTabs.value : null,
    analisaNotes: analisaNotes.status === "fulfilled" ? analisaNotes.value : null,
    rootCauseNotes: rootCauseNotes.status === "fulfilled" ? rootCauseNotes.value : null,
    aiSettings: aiSettings.status === "fulfilled" ? aiSettings.value : null
  };
}

function buildEmptyNkoStructure() {

function loadNkoStructure() {
  try {
    const raw = window.localStorage.getItem(NKO_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.byYear) {
        if (!parsed.years || !parsed.years.length) {
          parsed.years = Object.keys(parsed.byYear).map(Number).sort((a, b) => a - b);
        }
        return parsed;
      }
    }
  } catch (e) {}
  const byYear = {};
  BASE_YEARS.forEach(y => {
    byYear[y] = y === 2026 ? buildDefaultNkoStructure() : buildEmptyNkoStructure();
  });
  return { years: [...BASE_YEARS], byYear };
}
function saveNkoStructure(nkoState) {
  try {
    window.localStorage.setItem(NKO_STORAGE_KEY, JSON.stringify(nkoState));
  } catch (e) {}
  // Sinkronkan tiap tahun ke backend di background (debounced per tahun,
  // tidak memblokir UI). Kegagalan jaringan tidak menghapus data lokal.
  try {
    Object.keys(nkoState.byYear || {}).forEach(year => {
      performuPushNkoYear(Number(year), nkoState.byYear[year]);
    });
  } catch (e) {}
}
// Menggabungkan struktur dari backend (kalau ada) ke atas struktur lokal saat
// aplikasi pertama kali dibuka, supaya data konsisten lintas device/user.
async function performuMergeRemoteNkoStructure(localState) {
  const remote = await performuPullNkoStructure();
  if (!remote || !remote.byYear || !Object.keys(remote.byYear).length) return localState;
  const years = Array.from(new Set([...(localState.years || []), ...(remote.years || [])])).sort((a, b) => a - b);
  const byYear = { ...localState.byYear, ...remote.byYear };
  return { years, byYear };
}

/* --- Formula engine: hitung % pencapaian dan nilai tertimbang --- */
function nkoComputePct(node, resolved) {
  if (!node) return null;
  if (node.sourceType === "na") return null;
  if (node.formulaType === "direct") {
    return node.pencapaianManual === null || node.pencapaianManual === undefined ? null : node.pencapaianManual;
  }
  const rencana = resolved ? resolved.rencana : node.rencana;
  const realisasi = resolved ? resolved.realisasi : node.prognosa;
  if (rencana === null || rencana === undefined || realisasi === null || realisasi === undefined || rencana === 0) return null;
  let pct;
  if (node.formulaType === "inverse") {
    pct = rencana / realisasi * 100;
  } else {
    pct = realisasi / rencana * 100;
  }
  return round4(pct);
}
function nkoCappedPct(node, resolved) {
  const pct = nkoComputePct(node, resolved);
  if (pct === null) return null;
  const cap = node.capMax;
  if (cap === null || cap === undefined || cap === "" || Number.isNaN(cap)) return pct;
  return Math.min(pct, cap);
}
function nkoResolveNode(node, store, year, monthIdx, useForecast) {
  if (node.sourceType === "linked" && store) {
    const live = nkoLinkedValues(node, store, year, monthIdx);
    if (live) {
      const realisasiVal = useForecast ? (live.realisasi !== null && live.realisasi !== undefined ? live.realisasi : live.forecast) : live.realisasi;
      return { rencana: live.rencana, realisasi: realisasiVal };
    }
  }
  return { rencana: node.rencana, realisasi: node.prognosa };
}
function nkoLinkedValues(node, store, year, monthIdx) {
  if (node.sourceType !== "linked" || !node.linkedCatId || !store[node.linkedCatId]) return null;
  const cat = CATEGORIES.find(c => c.id === node.linkedCatId);
  const rows = store[node.linkedCatId].byYear ? store[node.linkedCatId].byYear[year] : null;
  if (!cat || !rows || rows.length === 0) return null;
  const mIdx = monthIdx === null || monthIdx === undefined ? null : monthIdx;

  if (cat.type === "monthlyGrouped") {
    const gk = node.linkedGroupKey;
    if (!gk) return null;
    const row = mIdx !== null ? rows[mIdx] : rows.filter(r => r[gk + "Realisasi"] !== null && r[gk + "Realisasi"] !== undefined).slice(-1)[0];
    if (!row) return null;
    return { rencana: row[gk + "Prognosa"], realisasi: row[gk + "Realisasi"], forecast: row[gk + "Forecast"] };
  }
  if (cat.type === "monthlySimple") {
    const row = mIdx !== null ? rows[mIdx] : rows.filter(r => r.realisasi !== null && r.realisasi !== undefined).slice(-1)[0];
    if (!row) return null;
    return { rencana: row.target, realisasi: row.realisasi, forecast: row.forecast };
  }
  if (cat.type === "itemGrouped") {
    // Perlu baris tertentu (mis. "Efektivitas Proses Produksi") dan periode tertentu (bulan/kuartal)
    const targetRow = node.linkedRowLabel ? rows.find(r => r.label === node.linkedRowLabel) : rows[0];
    if (!targetRow) return null;
    const periods = cat.periods;
    let periodKey = null;
    if (mIdx !== null) {
      // map month index (0-11) to this category's period label (bisa MONTHS atau QUARTERS)
      if (periods.length === 12) periodKey = periods[mIdx];
      else periodKey = periods[Math.floor(mIdx / 3)];
    } else {
      periodKey = periods.filter(p => targetRow[p + "Realisasi"] !== null && targetRow[p + "Realisasi"] !== undefined).slice(-1)[0];
    }
    if (!periodKey) return null;
    return { rencana: targetRow[periodKey + "Prognosa"], realisasi: targetRow[periodKey + "Realisasi"], forecast: targetRow[periodKey + "Forecast"], rowLabel: targetRow.label };
  }
  return null;
}
function nkoLinkedRowOptions(catId) {
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat || cat.type !== "itemGrouped") return [];
  return (cat.defaultItems || []).map(label => ({ value: label, label }));
}
function nkoComputeItemResult(item, weight, store, year, monthIdx, useForecast) {
  const isItemDeduction = item.formulaType === "deduction";
  const hasSubItems = item.subItems && item.subItems.length > 0;

  if (isItemDeduction && !hasSubItems) {
    const resolved = nkoResolveNode(item, store, year, monthIdx, useForecast);
    const realisasi = resolved.realisasi;
    const nilai = realisasi === null || realisasi === undefined ? null : round4(-Math.abs(realisasi));
    return { pct: null, nilai, subResults: null, rencana: null, prognosa: realisasi };
  }

  if (isItemDeduction && hasSubItems) {
    // Sub-KPI di bawah KPI pengurang selalu ikut bertipe pengurang; realisasi KPI induk
    // otomatis dijumlah dari realisasi seluruh sub-KPI-nya (tidak diinput manual).
    const subResults = item.subItems.map(s => {
      const sResolved = nkoResolveNode(s, store, year, monthIdx, useForecast);
      const sRealisasi = sResolved.realisasi;
      return { ...s, formulaType: "deduction", pct: null, nilai: sRealisasi === null || sRealisasi === undefined ? null : round4(-Math.abs(sRealisasi)), rencana: null, prognosa: sRealisasi };
    });
    const validSub = subResults.filter(s => s.nilai !== null && s.nilai !== undefined);
    const totalRealisasi = validSub.length > 0 ? validSub.reduce((a, s) => a + Math.abs(s.nilai), 0) : null;
    const nilai = totalRealisasi === null ? null : round4(-totalRealisasi);
    return { pct: null, nilai, subResults, rencana: null, prognosa: totalRealisasi };
  }

  let subResults = null;
  let pct = null;
  const ownResolved = nkoResolveNode(item, store, year, monthIdx, useForecast);
  const ownPct = nkoCappedPct(item, ownResolved);
  if (hasSubItems) {
    subResults = item.subItems.map(s => {
      if (s.formulaType === "deduction") {
        const sResolved = nkoResolveNode(s, store, year, monthIdx, useForecast);
        const sRealisasi = sResolved.realisasi;
        return { ...s, pct: null, nilai: sRealisasi === null || sRealisasi === undefined ? null : round4(-Math.abs(sRealisasi)), rencana: null, prognosa: sRealisasi };
      }
      const sResolved = nkoResolveNode(s, store, year, monthIdx, useForecast);
      return { ...s, pct: nkoCappedPct(s, sResolved), rencana: sResolved.rencana, prognosa: sResolved.realisasi };
    });
    if (ownPct !== null) {
      // KPI utama punya rencana/realisasi (atau % manual) sendiri — dipakai langsung,
      // sesuai format asli SA Kontrak Kinerja. Sub-KPI di bawahnya bersifat rincian saja.
      pct = ownPct;
    } else {
      // Tidak ada angka di level KPI utama — turunkan dari rata-rata sub-KPI sebagai fallback.
      const valid = subResults.filter(s => s.pct !== null);
      pct = valid.length > 0 ? round4(valid.reduce((a, s) => a + s.pct, 0) / valid.length) : null;
    }
  } else {
    pct = ownPct;
  }
  const nilai = pct === null ? null : round4(pct / 100 * weight);
  return { pct, nilai, subResults, rencana: ownResolved.rencana, prognosa: ownResolved.realisasi };
}
function nkoComputeStructureResult(structure, store, year, monthIdx, useForecast) {
  const categories = (structure.categories || []).map(cat => {
    const items = (cat.items || []).map(item => {
      const res = nkoComputeItemResult(item, item.weight || 0, store, year, monthIdx, useForecast);
      return { ...item, ...res };
    });
    const catNilai = items.reduce((s, it) => s + (it.nilai || 0), 0);
    const catWeightSum = items.reduce((s, it) => s + (it.weight || 0), 0);
    return { ...cat, items, nilai: round4(catNilai), itemsWeightSum: round4(catWeightSum) };
  });
  const totalWeight = categories.filter(c => (c.unit || "%") !== "deduction").reduce((s, c) => s + (c.weight || 0), 0);
  const totalNilai = categories.reduce((s, c) => s + (c.nilai || 0), 0);
  return { categories, totalWeight: round4(totalWeight), totalNilai: round4(totalNilai) };
}
function nkoHasAnyRealisasiForMonth(structure, store, year, monthIdx) {
  // Cek apakah ada minimal satu KPI/sub-KPI dengan data realisasi terisi pada bulan tsb.
  let found = false;
  (structure.categories || []).forEach(cat => {
    (cat.items || []).forEach(item => {
      const resolved = nkoResolveNode(item, store, year, monthIdx, false);
      if (resolved.realisasi !== null && resolved.realisasi !== undefined) found = true;
      (item.subItems || []).forEach(s => {
        const sResolved = nkoResolveNode(s, store, year, monthIdx, false);
        if (sResolved.realisasi !== null && sResolved.realisasi !== undefined) found = true;
      });
    });
  });
  return found;
}
function nkoComputeMonthlyRows(nkoState, store, year) {
  // Bangun 12 baris bulanan untuk tab "NKO" di menu Analisa: Target = total bobot,
  // Realisasi = total Nilai NKO bulan tsb, Prognosa = total Nilai NKO memakai data forecast bila realisasi kosong.
  const structure = nkoState.byYear[year];
  return MONTHS.map((m, idx) => {
    if (!structure) return { id: `${year}-${idx}`, bulan: `${m} ${year}`, nkoPrognosa: null, nkoRealisasi: null, nkoForecast: null };
    const hasRealisasi = nkoHasAnyRealisasiForMonth(structure, store, year, idx);
    const realResult = nkoComputeStructureResult(structure, store, year, idx, false);
    const forecastResult = nkoComputeStructureResult(structure, store, year, idx, true);
    return {
      id: `${year}-${idx}`,
      bulan: `${m} ${year}`,
      nkoPrognosa: realResult.totalWeight || null,
      nkoRealisasi: hasRealisasi ? realResult.totalNilai : null,
      nkoForecast: forecastResult.totalNilai
    };
  });
}

function nkoStructureToStructRows(structure) {
  const rows = [];

      level: "kategori", num: cat.num || "", label: cat.label || "", unit: cat.unit || "%",
      weight: cat.weight || 0, formulaType: "", capMax: "", sourceType: "", linkedCatId: "", linkedGroupKey: ""
    });
    (cat.items || []).forEach(item => {
      rows.push({
        level: "item", num: "", label: item.label || "", unit: item.unit || "%",
        weight: item.weight || 0, formulaType: item.formulaType || "normal", capMax: item.capMax != null ? item.capMax : 110,

      (item.subItems || []).forEach(sub => {

  return rows;
}

function periodToken(label) {

  const parts = String(label).trim().split(/\s+/);

function buildRuleBasedSummary(title, trend, unit, decimals) {
  if (!trend) return `Belum ada data realisasi untuk ${title}. Silakan lengkapi data input terlebih dahulu agar analisa dapat dihasilkan.`;
  const latestStr = fmtNum(trend.latest, decimals);
  const parts = [];
  parts.push(`${title} tercatat sebesar ${latestStr}${unit ? " " + unit : ""} pada periode ${trend.monthLabel || "terkini"}.`);
  if (trend.targetLatest !== null && trend.targetLatest !== undefined && trend.targetLatest) {
    const capaian = round1((trend.latest - trend.targetLatest) / trend.targetLatest * 100);
    if (capaian >= 0) {
      parts.push(`Capaian ini berada ${Math.abs(capaian)}% di atas target periode berjalan, menunjukkan kinerja yang baik.`);
    } else {
      parts.push(`Capaian ini masih ${Math.abs(capaian)}% di bawah target periode berjalan dan perlu mendapat perhatian.`);
    }
  }
  if (trend.delta !== undefined && trend.pct !== undefined && trend.pct !== 0) {
    parts.push(`Dibandingkan periode sebelumnya, nilai ini ${trend.delta >= 0 ? "naik" : "turun"} sekitar ${Math.abs(round1(trend.pct))}%.`);
  }
  if (trend.targetAkhir !== undefined && trend.prognosaAkhir !== undefined && trend.targetAkhir) {
    const gap = round1((trend.prognosaAkhir - trend.targetAkhir) / trend.targetAkhir * 100);
    parts.push(`Prognosa akhir periode diperkirakan ${fmtNum(trend.prognosaAkhir, decimals)}${unit ? " " + unit : ""}, ${gap >= 0 ? "melampaui" : "di bawah"} target sebesar ${Math.abs(gap)}%.`);
  }
  return parts.join(" ");
}

async function callClaudeAnalysis(apiKey, model, prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: model || "claude-sonnet-4-5-20250929",
      max_tokens: 400,
      messages: [{ role: "user", content: prompt }]
    })
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => "");
    throw new Error(`Claude API error (${res.status}): ${errText || res.statusText}`);
  }
  const data = await res.json();
  const text = (data.content || []).map(b => b.text || "").join("").trim();
  return text || "Tidak ada respons dari model.";
}

const GEMINI_FALLBACK_MODEL = "gemini-flash-latest";
async function callGeminiOnce(apiKey, model, prompt) {

  let res;

    res = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": apiKey
      },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })

  } catch (networkErr) {
    throw new Error(`Tidak dapat menghubungi Gemini API (kemungkinan masalah jaringan/CORS): ${networkErr.message}`);
  }
  if (!res.ok) {
    let errText = "";
    try {
      const errJson = await res.json();
      errText = (errJson && errJson.error && errJson.error.message) || JSON.stringify(errJson);
    } catch (e) {
      errText = await res.text().catch(() => "");
    }
    const err = new Error(`Gemini API error (${res.status}): ${errText || res.statusText}`);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  if (data.promptFeedback && data.promptFeedback.blockReason) {
    throw new Error(`Permintaan diblokir oleh Gemini (${data.promptFeedback.blockReason}).`);
  }
  const candidate = (data.candidates || [])[0];
  const text = (candidate && candidate.content && candidate.content.parts || []).map(p => p.text || "").join("").trim();
  if (!text) {
    const finishReason = candidate && candidate.finishReason;
    throw new Error(finishReason ? `Model tidak mengembalikan teks (finishReason: ${finishReason}).` : "Tidak ada respons dari model.");
  }

}
